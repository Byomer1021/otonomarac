# Varsayilan pipeline ayarlari.
# CLI argumanlari bu dosyayi ezer: python -m perception.cli --config configs/default.yaml --model yolov8s.pt

video:
  input: null
  output: outputs/result.mp4
  frame_stride: 1        # CPU'da 2-3 yapmak isleme suresini dogrudan boler
  max_frames: null       # hizli deneme icin ornegin 150
  resize_width: 1280

camera:
  # Kaputun/torpidonun basladigi satir, yukseklik orani olarak.
  # Bu satirin altindaki pikseller yol degil arac ici; derinlik orneklemesi
  # ve zemine degme noktasi oraya bakmamali. null = kaput gorunmuyor.
  hood_top: null
  # Homografinin kaynagi - her kamera/montaj icin ayri kalibre edilmeli:
  #   python scripts/calibrate_bev.py <video> --quad ... --verify
  # Sira: yakin-sol, yakin-sag, uzak-sag, uzak-sol. Piksel degil oran.
  road_quad: null

detection:
  # yolov8s, yolov8n'e gore parcalanmayi %44'ten %28'e dusuruyor ve GTX 1080'de
  # neredeyse bedava geliyor (56.7 -> 56.1 FPS; KITTI cozunurlugunde GPU zaten
  # doymuyor). Zayif donanimda yolov8n'e donun.
  model: yolov8s.pt      # n < s < m < l < x  (hiz <-> dogruluk)
  # DIKKAT: takip acikken bu deger tracking.track_low_thresh'in ALTINDA olmali.
  # Aksi halde ByteTrack'in dusuk guvenli ikinci eslestirme asamasina hic tespit
  # ulasmaz ve algoritma siradan IoU takibine duser. Config.validate() uyarir.
  conf: 0.05
  iou: 0.5
  imgsz: 640
  device: auto           # auto | cpu | cuda | cuda:0
  classes: [0, 1, 2, 3, 5, 7, 9]   # yaya, bisiklet, araba, motosiklet, otobus, kamyon, trafik isigi
  half: false            # GPU'da true yapmak hizlandirir

tracking:
  enabled: true
  track_high_thresh: 0.25   # birinci asama eslestirme
  track_low_thresh: 0.1     # ikinci asama - ByteTrack'in ayirt edici ozelligi
  new_track_thresh: 0.25    # yeni iz baslatma esigi
  track_buffer: 30          # kayip izin yasatilacagi kare sayisi
  # Sezgiye aykiri: maliyet 1-IoU ve esik ust sinir, yani YUKSELTMEK gevsetir.
  # 0.9 => IoU >= 0.1 kabul. Olcum: parcalanma %44 -> %24.
  match_thresh: 0.9
  fuse_score: true
  trail_seconds: 1.5        # hareket izinin gecmisi, saniye (0 = kapat)
  min_track_len: 5          # bundan kisa izler analizde "parcalanmis" sayilir

depth:
  enabled: true
  # Small / Base / Large. Small ile basla, olcup karar ver.
  model: depth-anything/Depth-Anything-V2-Small-hf
  device: auto
  half: false             # Pascal ve oncesi kartlarda FP16 daha yavas; otomatik reddedilir
  every_n_frames: 1       # 2-3 yapmak GPU yukunu dogrudan boler
  input_width: 518        # derinlik en pahali katman; tam cozunurluk gereksiz
  sample_width_ratio: 0.5   # kutunun ortadaki %50 genisligi
  sample_height_ratio: 0.25 # kutunun alt %25 yuksekligi
  show_panel: true
  colormap: INFERNO

bev:
  enabled: true
  # Dortgenin gercek dunyadaki genisligi. Serit genisligi (3.5 m) makul bir
  # baslangic, ama arac genisligiyle dogrulanmali - calibrate_bev.py --verify.
  quad_width_m: 3.5
  # VARSAYIM. Arac genisligi testi bu parametreyi kisitlamaz; degistirmek
  # haritadaki mutlak mesafeleri olcekler, siralamayi ve yanal konumu bozmaz.
  quad_depth_m: 12.0
  range_ahead_m: 35.0
  range_side_m: 12.0
  px_per_m: 12.0
  grid_step_m: 5.0
  max_range_m: 40.0

segmentation:
  enabled: true
  model: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
  device: auto
  half: false
  input_width: 768        # 768 -> 234 ms, 1024 -> 464 ms (CPU)
  # Yol sahnede araclardan cok daha yavas degisir.
  every_n_frames: 5
  close_kernel: 5
  show_lane_paint: true

risk:
  enabled: true
  min_observations: 5
  history_seconds: 1.2
  ttc_critical_s: 2.0
  ttc_warning_s: 4.0
  ttc_max_s: 10.0
  min_closing_speed: 0.5
  path_half_width_m: 1.7    # ego guzergah koridoru; disindakiler risk sayilmaz
  min_distance_m: 2.0
  min_confidence: 0.35      # detection.conf'tan bagimsiz ve belirgin yuksek
  max_fit_residual_ratio: 0.04   # ortulme kaynakli sahte hizlari eler

visualize:
  show_conf: true
  show_class_name: true
  show_hud: true
  show_trails: true
  line_thickness: 2
  font_scale: 0.5
