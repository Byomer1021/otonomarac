# Kendi cekimimiz (Maltepe, Istanbul) icin ayarlar.
# configs/default.yaml'dan farkli olan her sey burada gerekcesiyle duruyor.
#
# Kaynak: 2560x1440 / 59.94 fps / VP9, klipler 1920x1080 / 30 fps H.264'e cevrildi.

video:
  input: null
  output: outputs/maltepe.mp4
  frame_stride: 1
  max_frames: null
  resize_width: 1280

camera:
  # Olculdu: silecek ve torpido y=915'te basliyor (1080 piksellik karede),
  # y=940 altinda tamamen arac ici. 915/1080 = 0.847.
  # Izgara bindirilip elle okundu; zamansal varyans yeterince keskin ayrim
  # vermedi cunku kaputta yansima oynuyor.
  hood_top: 0.85

  # Homografinin kaynagi: yol duzleminde iki GERCEK yol-paralel cizgiden
  # kurulmus dortgen. Sol kenar sari orta cizgi (HSV maskesi + dogru fit,
  # x = -1.2732*y + 1298.7), sag kenar sagdaki beyaz serit boyasi.
  # Ufuk yuksekligi (y=480) gozle degil olcumle secildi - bkz. proje gunlugu.
  # Sira: yakin-sol, yakin-sag, uzak-sag, uzak-sol. Piksel degil oran.
  road_quad: [[0.4138, 0.8389], [0.6539, 0.8389], [0.5786, 0.7278], [0.4934, 0.7278]]

detection:
  model: yolov8s.pt
  conf: 0.05
  iou: 0.5
  imgsz: 640
  device: auto
  classes: [0, 1, 2, 3, 5, 7, 9]
  # GTX 1080 (sm_61) hizli FP16 desteklemiyor - istense de reddedilir.
  half: false

tracking:
  enabled: true
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  # 30 fps'te de gevsek esik kazandi (0.7 -> %55, 0.8 -> %23, 0.9 -> %16
  # parcalanma). Belirleyici olan kare hizi degil nesne olcegi: sehir icinde
  # yakin araclar karede buyuk ve kutu boyutu kare kare oynuyor.
  match_thresh: 0.9
  fuse_score: true
  trail_seconds: 1.5
  min_track_len: 5

depth:
  enabled: true
  model: depth-anything/Depth-Anything-V2-Small-hf
  # DERINLIK CPU'DA. Bu makinedeki GTX 1080 derinlik modelinin surekli yuku
  # altinda iki kez ekran baglantisini dusurdu ve makineyi yeniden baslatmak
  # gerekti. Tespit ve takip GPU'da onlarca calistirmada sorunsuz; kartı
  # dusuren ozellikle bu katman. CPU'da 321 ms/kare, every_n_frames=3 ile
  # 60 saniyelik klip ~3 dakikada bitiyor - gozetimsiz calistirilabilir.
  device: cpu
  # FP16 zaten reddedilirdi: sm_61'de hizli FP16 yolu yok, olculdu (56.5 ms'e
  # karsi 41.0 ms) ve coken calistirma da FP16'ydi.
  half: false
  # Derinlik sahnede tespit ve takipten cok daha yavas degisir; 3 karede bir
  # hesaplayip aradakilerde son haritayi kullanmak maliyeti ucte bire indiriyor.
  every_n_frames: 3
  # 518 referans kalite. 392 yaklasik iki kat hizli ve kare ici nesne
  # siralamasini buyuk olcude koruyor (Spearman 0.92); 294'te siralama
  # bozuluyor (0.76, en kotu karede 0.23) - oraya inilmemeli.
  input_width: 518
  sample_width_ratio: 0.5
  sample_height_ratio: 0.25
  # Derinlik paneli kapali: projenin gorsel imzasi iki panel (kamera + harita).
  # Derinlik yine hesaplaniyor ve etiketlere yaziliyor, sadece ayri panel
  # olarak gosterilmiyor. Hata ayiklarken --depth-panel ile acilabilir.
  show_panel: false
  colormap: INFERNO

bev:
  enabled: true
  # Dortgenin gercek genisligi. Serit genisligi (3.5 m) varsayilmadi, OLCULDU:
  # kalibrasyonda hic kullanilmayan bir referansla - arac genisligi. Zemine
  # yansitilan araclarin medyan genisligi 1.80 m'ye gelecek sekilde ayarlandi.
  quad_width_m: 3.84
  # VARSAYIM, olcum degil. Arac genisligi testi bu parametreyi kisitlamiyor:
  # 6 ile 22 m arasinda degistirildiginde medyan genislik (1.57-1.94 m) ve
  # mesafe korelasyonu (+-0.07) degismiyor, sadece haritadaki mutlak mesafeler
  # olcekleniyor. Monokuler olcek belirsizligi tam olarak bu. Hafta 5'te
  # bagimsiz bir boylamsal referansla kalibre edilecek.
  quad_depth_m: 12.0
  range_ahead_m: 35.0
  range_side_m: 12.0
  px_per_m: 12.0
  grid_step_m: 5.0
  # Bu mesafenin otesinde homografi hizla bozulur; orada uretilen konum
  # olculmus sayilmamali, o yuzden cizilmiyor.
  max_range_m: 40.0

segmentation:
  enabled: true
  model: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
  # Derinlikteki ayni gerekce: bu makinedeki kart agir sureklilikte yuku
  # kaldiramiyor, segmentasyon da CPU'da kaliyor.
  device: cpu
  half: false
  input_width: 768        # 768 -> 234 ms, 1024 -> 464 ms (CPU)
  # Yol sahnede araclardan cok daha yavas degisir.
  every_n_frames: 5
  close_kernel: 5
  show_lane_paint: true

risk:
  enabled: true
  min_observations: 5       # iki noktadan cikarilan hiz gurultunun kendisidir
  history_seconds: 1.2
  ttc_critical_s: 2.0
  ttc_warning_s: 4.0
  ttc_max_s: 10.0
  min_closing_speed: 0.5
  # Ego arac hareket ettigi icin park halindeki her nesne de "yaklasiyor"
  # gorunur. Yanal kapi olmadan 104 izin 57'si kritik cikiyordu.
  path_half_width_m: 1.7
  min_distance_m: 2.0
  # detection.conf takip icin 0.05; o zayif kutular titrer ve uydurma hiz
  # uretir. Risk daha yuksek bir esik ister.
  min_confidence: 0.35
  # Kismen ortulu aracin zemine degme noktasi gorunmez; homografi onu
  # oldugundan uzaga koyar ve ortulme degistikce mesafe ziplar. Fit artigi
  # bunu yakaliyor - olcumde sahte bir kritik uyariyi eledi.
  max_fit_residual_ratio: 0.04

visualize:
  show_conf: true
  show_class_name: true
  show_hud: true
  show_trails: true
  line_thickness: 2
  font_scale: 0.5
