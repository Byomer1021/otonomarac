[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception"
version = "0.1.0"
description = "Tek kamera tabanli surus sahnesi algilama ve kusbakisi haritalama sistemi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omer Can ATLI" }]
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "transformers>=4.45",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "tqdm>=4.66.0",
]

[project.scripts]
perception = "perception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
